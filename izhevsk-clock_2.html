<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Время в Ижевске</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .wrapper {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .clock {
    display: flex;
    gap: 4%;
    /* width/height are set from JS to exactly fit the wrapper
       (contain-style fit) so there are no empty gaps and nothing
       gets clipped, whatever the widget's width/height ratio is */
  }

  .flip-card {
    position: relative;
    container-type: inline-size;
    flex: 1;
    aspect-ratio: 150 / 190;
    perspective: 400px;
  }

  /* статичный фон карточки + разделительная линия */
  .flip-card .bg {
    position: absolute;
    inset: 0;
    background: #ff8c1a;
    border-radius: 12%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }
  .flip-card .bg::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(0,0,0,0.12);
    transform: translateY(-1px);
  }

  /* статичные половинки с текущим/новым значением */
  .half {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    background: #ff8c1a;
    display: flex;
    justify-content: center;
  }
  .half.top { top: 0; border-radius: 12% 12% 0 0; align-items: flex-end; }
  .half.bottom { bottom: 0; border-radius: 0 0 12% 12%; align-items: flex-start; }

  .half .num {
    font-size: 65cqw;
    font-weight: 800;
    color: #ffd6e8;
    line-height: 1;
    transform: translateY(50%);
    user-select: none;
  }
  .half.bottom .num { transform: translateY(-50%); }

  /* флип-панели (анимируются) */
  .flap {
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    overflow: hidden;
    background: #ff8c1a;
    display: flex;
    justify-content: center;
    backface-visibility: hidden;
    z-index: 5;
  }
  .flap .num {
    font-size: 65cqw;
    font-weight: 800;
    color: #ffd6e8;
    line-height: 1;
    user-select: none;
  }

  .flap.top {
    top: 0;
    align-items: flex-end;
    border-radius: 12% 12% 0 0;
    transform-origin: bottom center;
  }
  .flap.top .num { transform: translateY(50%); }

  .flap.bottom {
    bottom: 0;
    align-items: flex-start;
    border-radius: 0 0 12% 12%;
    transform-origin: top center;
    transform: rotateX(90deg);
  }
  .flap.bottom .num { transform: translateY(-50%); }

  .flap.animate-top {
    transition: transform 0.28s ease-in;
    transform: rotateX(-90deg);
  }
  .flap.animate-bottom {
    transition: transform 0.28s ease-out;
    transform: rotateX(0deg);
  }

  .label {
    position: absolute;
    left: 10%;
    bottom: 6%;
    font-size: 10cqw;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffd6e8;
    opacity: 0.9;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="clock">

      <div class="flip-card" id="hourCard">
        <div class="bg"></div>
        <div class="half top"><div class="num" id="hourTopStatic">--</div></div>
        <div class="half bottom"><div class="num" id="hourBottomStatic">--</div></div>
        <div class="flap top" id="hourFlapTop"><div class="num" id="hourFlapTopNum">--</div></div>
        <div class="flap bottom" id="hourFlapBottom"><div class="num" id="hourFlapBottomNum">--</div></div>
        <div class="label" id="ampm">--</div>
      </div>

      <div class="flip-card" id="minuteCard">
        <div class="bg"></div>
        <div class="half top"><div class="num" id="minTopStatic">--</div></div>
        <div class="half bottom"><div class="num" id="minBottomStatic">--</div></div>
        <div class="flap top" id="minFlapTop"><div class="num" id="minFlapTopNum">--</div></div>
        <div class="flap bottom" id="minFlapBottom"><div class="num" id="minFlapBottomNum">--</div></div>
      </div>

    </div>
  </div>

  <script>
    // --- Адаптивная подгонка под размер контейнера ---------------------
    // Внутренние пропорции часов (ширина:высота) не зависят от размера
    // экрана: 2 карточки с aspect-ratio 150/190 + gap 4% между ними.
    //   W = ширина карточки, gap = 0.04 * Cw (Cw = ширина всего .clock)
    //   2W + gap = Cw  =>  W = 0.48 * Cw
    //   H = W * (190/150) = 0.608 * Cw
    //   => Cw / H ≈ 1.6447
    const CLOCK_RATIO = 1.6447;

    const wrapperEl = document.querySelector(".wrapper");
    const clockEl = document.querySelector(".clock");

    function fitClock() {
      const ww = wrapperEl.clientWidth;
      const wh = wrapperEl.clientHeight;
      if (!ww || !wh) return;

      let w = ww;
      let h = w / CLOCK_RATIO;

      if (h > wh) {
        h = wh;
        w = h * CLOCK_RATIO;
      }

      clockEl.style.width = w + "px";
      clockEl.style.height = h + "px";
    }

    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(fitClock).observe(wrapperEl);
    } else {
      window.addEventListener("resize", fitClock);
    }
    fitClock();
    // ---------------------------------------------------------------------

    const TIME_ZONE = "Europe/Samara"; // МСК+1 (UTC+4), время Ижевска

    let currentHour = null;
    let currentMinute = null;

    function getParts() {
      const now = new Date();
      const hourParts = new Intl.DateTimeFormat("en-US", {
        timeZone: TIME_ZONE,
        hour: "2-digit",
        hour12: true
      }).formatToParts(now);

      const hour12 = hourParts.find(p => p.type === "hour").value.padStart(2, "0");
      const dayPeriod = hourParts.find(p => p.type === "dayPeriod").value.toUpperCase();

      const minute = new Intl.DateTimeFormat("en-GB", {
        timeZone: TIME_ZONE,
        minute: "2-digit"
      }).format(now).padStart(2, "0");

      return { hour: hour12, minute, dayPeriod };
    }

    function flip(prefix, oldVal, newVal) {
      const flapTop = document.getElementById(prefix + "FlapTop");
      const flapBottom = document.getElementById(prefix + "FlapBottom");
      const flapTopNum = document.getElementById(prefix + "FlapTopNum");
      const flapBottomNum = document.getElementById(prefix + "FlapBottomNum");
      const topStatic = document.getElementById(prefix + "TopStatic");
      const bottomStatic = document.getElementById(prefix + "BottomStatic");

      // Reset both flaps to their resting state instantly (no transition),
      // relying purely on the base CSS rules (.flap.top => rotateX(0deg),
      // .flap.bottom => rotateX(90deg)). We must NOT set an inline
      // "transform" here: an inline style always wins over a class rule,
      // so if we set it directly the .animate-top/.animate-bottom classes
      // added below would never be able to change it and the flap would
      // just sit still (which is why the flip used to freeze).
      flapTop.style.transition = "none";
      flapBottom.style.transition = "none";
      flapTop.classList.remove("animate-top");
      flapBottom.classList.remove("animate-bottom");

      topStatic.textContent = newVal;
      flapTopNum.textContent = oldVal;
      flapBottomNum.textContent = newVal;

      // force reflow so the reset above is applied before we re-enable
      // transitions and start animating
      void flapTop.offsetWidth;
      void flapBottom.offsetWidth;

      requestAnimationFrame(() => {
        flapTop.style.transition = "";
        flapBottom.style.transition = "";
        flapTop.classList.add("animate-top");

        setTimeout(() => {
          flapBottom.classList.add("animate-bottom");
        }, 140);

        setTimeout(() => {
          bottomStatic.textContent = newVal;
        }, 420);
      });
    }

    function update() {
      const { hour, minute, dayPeriod } = getParts();

      if (currentHour === null) {
        document.getElementById("hourTopStatic").textContent = hour;
        document.getElementById("hourBottomStatic").textContent = hour;
        document.getElementById("hourFlapTopNum").textContent = hour;
        document.getElementById("hourFlapBottomNum").textContent = hour;
      } else if (hour !== currentHour) {
        flip("hour", currentHour, hour);
      }

      if (currentMinute === null) {
        document.getElementById("minTopStatic").textContent = minute;
        document.getElementById("minBottomStatic").textContent = minute;
        document.getElementById("minFlapTopNum").textContent = minute;
        document.getElementById("minFlapBottomNum").textContent = minute;
      } else if (minute !== currentMinute) {
        flip("min", currentMinute, minute);
      }

      currentHour = hour;
      currentMinute = minute;
      document.getElementById("ampm").textContent = dayPeriod;
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
